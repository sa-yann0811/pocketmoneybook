<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17323a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="お小遣い帳">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>お小遣い帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
<style>
/* layout: 1カラムのノート。今のお金(好きな色) → 記録フォーム → 帳簿(残り列つき) → 使い道 → 設定 */
:root{
  --bg:#f2f5f6; --card:#ffffff; --ink:#15252c; --ink2:#586a72; --line:#dce4e7; --soft:#e8eff1;
  --in:#0a7a6c; --in-bg:#dff3ef; --on-in:#ffffff;
  --out:#cf4338; --out-bg:#fbe6e3; --on-out:#ffffff;
  --goal:#e0a526;
  --hero-bg:#17323a; --hero-ink:#f2f8f9; --hero-ink2:#a9c1c8; --hero-in:#7be0d0; --hero-out:#ffb1a8; --hero-track:rgba(255,255,255,.16);
  --focus:#1d5fd6;
  --f-ui:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-num:"DM Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e171b; --card:#16232a; --ink:#e7eff2; --ink2:#9db0b8; --line:#26363e; --soft:#1d2d35;
    --in:#4fd1bd; --in-bg:#123a36; --on-in:#08211e;
    --out:#ff8a7d; --out-bg:#43211e; --on-out:#2a0b08;
    --hero-bg:#1b3a43; --focus:#7fb0ff;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e171b; --card:#16232a; --ink:#e7eff2; --ink2:#9db0b8; --line:#26363e; --soft:#1d2d35;
  --in:#4fd1bd; --in-bg:#123a36; --on-in:#08211e;
  --out:#ff8a7d; --out-bg:#43211e; --on-out:#2a0b08;
  --hero-bg:#1b3a43; --focus:#7fb0ff;
  color-scheme:dark;
}
html{background:var(--bg);color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font-family:var(--f-ui); font-size:16px; line-height:1.7;
  padding-block:20px 48px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
/* ふりがな: 親文字のすぐ上に、中央ぞろえで小さく置く */
.fu{display:inline-block;text-align:center;vertical-align:baseline;white-space:nowrap;text-indent:0}
.fu-r{display:block;font-size:.5em;line-height:1;font-weight:400;letter-spacing:0;margin-bottom:.02em}
.fu-b{display:block;line-height:1.1}
body.nofuri .fu{display:inline}
body.nofuri .fu-r{display:none}
body.nofuri .fu-b{display:inline;line-height:inherit}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px;min-width:0}
.wrap>*{min-width:0}
h1{font-size:20px;line-height:1.5;margin:0;font-weight:700;letter-spacing:.02em}
h2{font-size:16px;margin:0;font-weight:700}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.tools{display:flex;gap:8px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:44px;height:44px;border-radius:22%;flex:none;box-shadow:0 0 0 1px var(--line)}
.ghost{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink2);font-size:14px}
.ghost[aria-expanded="true"]{background:var(--soft);color:var(--ink)}

.people{display:flex;gap:8px;flex-wrap:wrap}
.person{min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:500}
.person[aria-pressed="true"]{background:var(--hero-bg);border-color:var(--hero-ink2);color:var(--hero-ink);font-weight:700}
.person.add{padding:0 16px;color:var(--ink2)}

.main{display:flex;flex-direction:column;gap:16px;min-width:0}
.main>*{min-width:0}
.sub{font-size:13px;color:var(--ink2);margin:0}
.code{font-family:var(--f-num);font-size:20px;letter-spacing:.06em;word-break:break-all;user-select:all;-webkit-user-select:all}
.pickbtn{width:100%;text-align:left;font-size:18px}
.ovlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.ovcard{width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.ov-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.ov-name{font-weight:700;font-size:18px;display:inline-flex;align-items:center;gap:8px;min-width:0;overflow-wrap:anywhere}
.dot{width:12px;height:12px;border-radius:50%;flex:none;display:inline-block}
.ov-bal{font-size:26px;font-weight:500}
.ov-bal.neg{color:var(--out)}
.ov-mid{display:flex;gap:6px 18px;flex-wrap:wrap;font-size:14px;color:var(--ink2)}
.ov-mid .i b{color:var(--in);font-weight:500}
.ov-mid .o b{color:var(--out);font-weight:500}
.ov-goal{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink2)}
.ov-track{display:block;height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.ov-fill{display:block;height:100%;background:var(--goal);border-radius:99px}
.ov-more{font-size:13px;color:var(--ink2);text-align:right}
.person.all{border-style:dashed}
.banner{background:var(--soft);border-radius:var(--r);padding:12px 14px;font-size:14px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.banner p{margin:0}

.hero{background:var(--hero-bg);color:var(--hero-ink);border-radius:var(--r);padding:20px 18px 18px;display:flex;flex-direction:column;gap:14px}
.hero .lab{font-size:14px;color:var(--hero-ink2);margin:0}
.hero .big{font-size:clamp(36px,12vw,52px);line-height:1.1;font-weight:500;margin:0;overflow-wrap:anywhere}
.hero .big.neg{color:var(--hero-out)}
.pair{display:flex;gap:10px 24px;flex-wrap:wrap;font-size:14px;color:var(--hero-ink2)}
.pair b{font-weight:500}
.pair .i b{color:var(--hero-in)}
.pair .o b{color:var(--hero-out)}
.goal{border-top:1px solid rgba(255,255,255,.14);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.goal-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:14px}
.goal-head span:first-child{min-width:0;overflow-wrap:anywhere}
.track{height:10px;border-radius:99px;background:var(--hero-track);overflow:hidden}
.fill{height:100%;background:var(--goal);border-radius:99px;transition:width .4s ease}
.goal-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;color:var(--hero-ink2)}
.link{background:none;border:0;padding:0 4px;min-height:44px;color:var(--hero-ink);text-decoration:underline;text-underline-offset:3px;font-size:14px}
.rem{font-size:17px;color:var(--hero-ink)}
.rem b{font-size:26px;font-weight:500}
.hint{font-size:13px;color:var(--hero-ink2);margin:0}
.gform{display:flex;flex-direction:column;gap:10px}
.gform label{font-size:13px;color:var(--hero-ink2)}
.gform input{width:100%;min-height:44px;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:var(--hero-ink);padding:0 12px}
.gform input[type="date"]{color-scheme:dark}
.gform .row2{display:flex;gap:8px;flex-wrap:wrap}
.hbtn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid rgba(255,255,255,.3);background:transparent;color:var(--hero-ink)}
.hbtn.main{background:var(--hero-ink);color:var(--hero-bg);border-color:var(--hero-ink);font-weight:700}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{min-height:52px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:17px}
.seg button[data-t="in"][aria-pressed="true"]{background:var(--in);border-color:var(--in);color:var(--on-in)}
.seg button[data-t="out"][aria-pressed="true"]{background:var(--out);border-color:var(--out);color:var(--on-out)}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>.lab{font-size:14px;color:var(--ink2)}
.amtrow{display:flex;align-items:center;gap:8px}
.amtrow input{flex:1;min-width:0;font-family:var(--f-num);font-size:28px;font-weight:500;text-align:right}
.unit{font-size:18px;color:var(--ink2)}
input[type="text"],input[type="date"],input[inputmode]{min-height:48px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);width:100%}
input[type="date"]{display:block;min-width:0;max-width:100%;-webkit-appearance:none;appearance:none;text-align:left;line-height:1.4}
input[type="date"]::-webkit-date-and-time-value{text-align:left;min-height:1.4em;margin:0}
input[type="date"]::-webkit-calendar-picker-indicator{margin:0}
input::placeholder{color:var(--ink2);opacity:.7}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:15px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
form[data-type="in"] .chip[aria-pressed="true"]{background:var(--in-bg);border-color:var(--in);color:var(--in);font-weight:700}
form[data-type="out"] .chip[aria-pressed="true"]{background:var(--out-bg);border-color:var(--out);color:var(--out);font-weight:700}
.chip[aria-pressed="true"].plain{background:var(--hero-bg);border-color:var(--hero-bg);color:var(--hero-ink)}
.preview{font-size:14px;color:var(--ink2);min-height:1.6em;margin:0}
.err{color:var(--out);font-size:14px;margin:0;min-height:1.4em}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.submit{flex:1 1 160px;min-height:54px;border-radius:12px;border:0;font-weight:700;font-size:18px}
form[data-type="in"] .submit{background:var(--in);color:var(--on-in)}
form[data-type="out"] .submit{background:var(--out);color:var(--on-out)}
.btn{min-height:54px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
.btn.danger,.dbtn{border-color:var(--out);color:var(--out)}
.btn.armed,.dbtn.armed{background:var(--out);color:var(--on-out)}
.dbtn{min-height:48px;padding:0 16px;border-radius:10px;border:1px solid var(--out);background:var(--card)}

.lhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mnav{display:flex;align-items:center;gap:4px}
.mnav button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:18px;line-height:1}
.mnav button:disabled{opacity:.35;cursor:default}
.mnav .ml{min-width:6.5em;text-align:center;font-weight:700}
.vtog{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;align-self:flex-start}
.vtog button{min-height:38px;padding:0 14px;border-radius:999px;border:0;background:transparent;color:var(--ink2);font-size:14px}
.vtog button[aria-pressed="true"]{background:var(--hero-bg);color:var(--hero-ink);font-weight:700}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{font-size:12px;color:var(--ink2);text-align:center;padding:2px 0;line-height:1.7}
.cd{min-height:58px;padding:4px 1px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;font-size:13px;line-height:1.25;overflow:hidden;min-width:0}
.cd:disabled{opacity:.4;cursor:default}
.cd.today{border:2px solid var(--ink)}
.cd[aria-pressed="true"]{background:var(--soft);border:2px solid var(--focus)}
.cd.blank{border:0;background:none}
.cd .d{font-weight:500}
.cd .ci,.cd .co{font-family:var(--f-num);font-size:10px;white-space:nowrap}
.cd .ci{color:var(--in)}
.cd .co{color:var(--out)}
.dayfilter{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;background:var(--soft);border-radius:10px;padding:6px 6px 6px 12px;font-size:14px}
.list{list-style:none;margin:0;padding:0}
.day{font-size:13px;color:var(--ink2);padding:10px 0 4px;border-bottom:1px solid var(--ink2);letter-spacing:.04em}
.row{border-bottom:1px dashed var(--line)}
.rbtn{width:100%;background:none;border:0;padding:10px 0;text-align:left;display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:12px;row-gap:0;align-items:baseline;border-radius:8px}
.rbtn:hover{background:var(--soft)}
.r-main{display:flex;flex-direction:column;min-width:0}
.r-cat{font-weight:500}
.r-memo{font-size:13px;color:var(--ink2);overflow-wrap:anywhere}
.r-amt{font-family:var(--f-num);font-size:18px;font-weight:500;text-align:right}
.r-amt.in{color:var(--in)}
.r-amt.out{color:var(--out)}
.r-bal{grid-column:2;font-size:12px;color:var(--ink2);text-align:right}
.row.sample .rbtn{opacity:.8}
.empty{color:var(--ink2);font-size:15px;margin:6px 0;text-align:center;padding:14px 0}

.bars{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.bar-l{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.bar-t{height:8px;border-radius:99px;background:var(--soft);margin-top:4px;overflow:hidden}
.bar-f{height:100%;background:var(--out);border-radius:99px}

.set{display:flex;flex-direction:column;gap:12px}
.set hr{border:0;border-top:1px solid var(--line);margin:4px 0;width:100%}
.set p{margin:0;font-size:14px;color:var(--ink2)}
.set .inline{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.set .inline input{flex:1 1 140px}
.swatches{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sw{width:44px;height:44px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1px var(--line);color:#fff;font-size:20px;line-height:1;display:grid;place-items:center;padding:0;position:relative;overflow:hidden}
.sw[aria-pressed="true"],.sw.on{box-shadow:0 0 0 3px var(--ink)}
.sw.custom{background:conic-gradient(#e53935,#fdd835,#43a047,#1e88e5,#8e24aa,#e53935)}
.sw.custom input{position:absolute;inset:0;opacity:0;width:100%;height:100%;padding:0;border:0;cursor:pointer}
.file{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.mode{margin:-6px 0 0;font-size:13px;color:var(--ink2)}
.rbtn:disabled{cursor:default;color:var(--ink)}
.rbtn:disabled:hover{background:none}
.foot{font-size:13px;color:var(--ink2);margin:0;text-align:center}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:15px;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){
  .fill,#toast{transition:none}
}
</style>

</head>

var CJK=/[一-鿿⟦]/;
function rubyFrag(str){
  var frag=document.createDocumentFragment(),buf='',i=0,has=false;
  function flush(){if(buf){frag.append(document.createTextNode(buf));buf=''}}
  function add(base,rt){
    flush();has=true;
    var r=document.createElement('span');r.className='fu';
    var t=document.createElement('span');t.className='fu-r';t.setAttribute('aria-hidden','true');t.textContent=rt;
    var b=document.createElement('span');b.className='fu-b';b.textContent=base;
    r.append(t,b);frag.append(r);
  }
  while(i<str.length){
    var ch=str.charAt(i);
    if(ch==='⟦'){
      var j=str.indexOf('⟧',i);
      if(j>i){var parts=str.slice(i+1,j).split('|');if(parts.length===2){add(parts[0],parts[1]);i=j+1;continue}}
    }
    if(CJK.test(ch)){
      var hit=null;
      for(var k=0;k<DICT.length;k++){if(str.substr(i,DICT[k][0].length)===DICT[k][0]){hit=DICT[k];break}}
      if(hit){add(hit[0],hit[1]);i+=hit[0].length;continue}
    }
    buf+=ch;i++;
  }
  flush();
  return has?frag:null;
}
function furigana(root){
  if(!root)return;
  var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:function(n){
    if(!CJK.test(n.nodeValue))return NodeFilter.FILTER_REJECT;
    var p=n.parentNode;
    if(p&&p.closest&&p.closest('.fu,script,style,input,textarea,[data-user]'))return NodeFilter.FILTER_REJECT;
    return NodeFilter.FILTER_ACCEPT;
  }});
  var nodes=[];while(w.nextNode())nodes.push(w.currentNode);
  nodes.forEach(function(n){var f=rubyFrag(n.nodeValue);if(f)n.parentNode.replaceChild(f,n)});
}

function el(tag,props){
  var n=document.createElement(tag);
  if(props){for(var k in props){var v=props[k];
    if(v==null||v===false)continue;
    if(k==='class')n.className=v;
    else if(k==='text')n.textContent=v;
    else if(k.indexOf('on')===0)n.addEventListener(k.slice(2),v);
    else n.setAttribute(k,v===true?'':v);}}
  for(var i=2;i<arguments.length;i++){

  }

  var r=parseInt(hex.substr(1,2),16),g=parseInt(hex.substr(3,2),16),b=parseInt(hex.substr(5,2),16),n=0;
  while(lum(r,g,b)>0.07&&n<40){r=Math.round(r*.92);g=Math.round(g*.92);b=Math.round(b*.92);n++}

}

function cleanState(raw){
  if(!raw||typeof raw!=='object'||!Array.isArray(raw.people)||!Array.isArray(raw.entries))return null;
  var ids={},people=[];
  raw.people.forEach(function(p){
    if(!p||typeof p.id!=='string'||ids[p.id])return;
    ids[p.id]=1;
    var g=null;
    if(p.goal&&typeof p.goal==='object'&&Number(p.goal.target)>0){
      g={name:String(p.goal.name||'').slice(0,20),target:Math.min(Math.floor(Number(p.goal.target)),MAXAMT*100)};
      if(/^\d{4}-\d{2}-\d{2}$/.test(String(p.goal.by||'')))g.by=p.goal.by;
      if(p.goal.s)g.s=true;
    }
    people.push({id:p.id,name:String(p.name||'じぶん').slice(0,20),start:Math.floor(Number(p.start))||0,
      color:/^#[0-9a-fA-F]{6}$/.test(String(p.color||''))?p.color:null,goal:g,ts:Number(p.ts)||0});
  });
  if(!people.length)return null;
  var entries=[];
  raw.entries.forEach(function(e){
    if(!e||!ids[e.pid]||(e.type!=='in'&&e.type!=='out'))return;
    var amt=Math.floor(Number(e.amt));
    if(!(amt>0)||!/^\d{4}-\d{2}-\d{2}$/.test(String(e.date)))return;
    var cat=String(e.cat||'その他').slice(0,20);
    var o={id:typeof e.id==='string'?e.id:uid(),pid:e.pid,date:e.date,type:e.type,amt:amt,cat:LEGACY[cat]||cat,memo:String(e.memo||'').slice(0,40),ts:Number(e.ts)||0};
    if(e.s)o.s=true;
    entries.push(o);
  });
  var cur=ids[raw.cur]?raw.cur:people[0].id;
  return {v:1,sample:!!raw.sample,furi:raw.furi!==false,cur:cur,people:people,entries:entries};
}

  var raw={v:1,cur:S.cur,furi:S.furi!==false,people:[],entries:[]};

function syncRemote(){
  if(!shared||!ready||readOnly||S.sample)return;
  S.people.forEach(function(p,i){if(!p.ts)p.ts=Date.now()+i});
  S.people.forEach(function(p){
    var d=personDoc(p),j=JSON.stringify(d);
    if(remote.people[p.id]!==j)enqueue({t:'set',k:'p',id:p.id,d:d,j:j});
  });
  Object.keys(remote.people).forEach(function(id){
    if(!S.people.some(function(p){return p.id===id}))enqueue({t:'del',k:'p',id:id});
  });
  var have={};
  S.entries.forEach(function(e){
    if(e.s)return;
    have[e.id]=1;
    var d=entryDoc(e),j=JSON.stringify(d);
    if(remote.entries[e.id]!==j)enqueue({t:'set',k:'e',id:e.id,d:d,j:j});
  });
  Object.keys(remote.entries).forEach(function(id){
    if(!have[id])enqueue({t:'del',k:'e',id:id});
  });

async function pump(){
  if(pumping)return;

    var op=queue[0];

      var ref=dbx.doc((op.k==='p'?'notes/':'entries/')+op.id);
      if(op.t==='set')await ref.set(op.d);else await ref.delete();
      queue.shift();
    }catch(e){
      queue.shift();
      var code=e&&e.code;
      (op.k==='p'?remote.people:remote.entries)[op.id]='?';
      if(code==='invalid_argument'){queue.length=0;readOnly=true;pumping=false;onRemote();toast('この画面では書きこめません（見るだけのモードです）');return}
      toast(code==='quota_exceeded'?'これ以上は保存できません':'共有ノートに保存できませんでした');
    }
  }
  pumping=false;
}

function makeDl(){

    try{
      var type=/\.csv$/.test(o.filename)?'text/csv;charset=utf-8':'application/json;charset=utf-8';
      var blob=new Blob([o.data],{type:type}),url=URL.createObjectURL(blob);

function makeShim(fsm,ref){
  var subs={notes:[],entries:[]},errs=[],unsub=null,cache=null;
  function field(c){return c==='notes'?'people':'entries'}
  function snapOf(c){
    var m=cache[field(c)];
    return {docs:Object.keys(m).map(function(id){return {id:id,data:function(){return m[id]}}}),metadata:{fromCache:cache.fromCache}};
  }
  function emit(){if(!cache)return;['notes','entries'].forEach(function(c){var sn=snapOf(c);subs[c].slice().forEach(function(o){o.next(sn)})})}
  function start(){
    if(unsub)return;
    unsub=fsm.onSnapshot(ref,function(ds){
      var d=ds.exists()?ds.data():{};
      cache={people:d.people||{},entries:d.entries||{},fromCache:ds.metadata.fromCache};
      emit();
    },function(err){errs.slice().forEach(function(f){f(err)})});
  }
  return {
    collection:function(name){return {onSnapshot:function(next,error){
      var o={next:next};subs[name].push(o);if(error)errs.push(error);
      start();if(cache)next(snapOf(name));
      return function(){var i=subs[name].indexOf(o);if(i>=0)subs[name].splice(i,1)};
    }}},
    doc:function(path){
      var a=path.split('/'),f=field(a[0]),id=a[1];
      return {
        set:function(data){var o={};o[f]={};o[f][id]=data;return fsm.setDoc(ref,o,{merge:true})},
        delete:function(){var o={};o[f]={};o[f][id]=fsm.deleteField();return fsm.setDoc(ref,o,{merge:true})}

function renderMode(){
  var t='';
  if(modeChecked){
    if(!cloudOn()||fam.local)t='この端末だけに保存しています。';
    else if(!fam.code)t='';
    else if(!shared)t='この端末だけに保存しています（家族ノートにはつながっていません）。';
    else if(!ready)t='家族ノートにつないでいます…';
    else t=role==='child'?'家族ノート：こども用':'家族ノート：保護者用（みんなの記録を見られます）';
  }
  $('#mode').textContent=t;

async function initShared(){
  if(!cloudOn()||!fam.code){modeChecked=true;renderMode();render();return}
  try{
    var base='https://www.gstatic.com/firebasejs/10.12.2/';
    var mods=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-firestore.js')]);
    var app=mods[0].initializeApp(window.FIREBASE_CONFIG),fs=mods[1].getFirestore(app);
    dbx=makeShim(mods[1],mods[1].doc(fs,'families',fam.code));
  }catch(e){dbx=null}
  modeChecked=true;
  if(!dbx){toast('家族ノートにつなげませんでした。この端末だけで使います');renderMode();render();return}
  readOnly=false;shared=true;renderMode();
  var defin={n:false,e:false},tmo;
  function fallback(){stopShared();shared=false;ready=false;renderMode();render()}
  function chk(){
    if(defin.n&&defin.e&&!ready){
      ready=true;clearTimeout(tmo);
      if(storeHasPeople())onRemote();
      else if(!S.sample&&!readOnly)syncRemote();
      renderMode();render();
    }
  }
  function errh(err){
    if(!ready){clearTimeout(tmo);toast('家族ノートにつなげませんでした（'+((err&&err.code)||'エラー')+'）');fallback()}
    else toast('家族ノートとのつながりが切れました');
  }
  tmo=setTimeout(function(){if(!ready){toast('家族ノートにつながりません。この端末だけで使います');fallback()}},10000);
  try{
    unsubs.push(dbx.collection('notes').onSnapshot(function(snap){
      rdocs.people={};snap.docs.forEach(function(d){rdocs.people[d.id]=d.data()});
      if(!snap.metadata.fromCache)defin.n=true;
      if(ready)onRemote();else chk();
    },errh));
    unsubs.push(dbx.collection('entries').onSnapshot(function(snap){
      rdocs.entries={};snap.docs.forEach(function(d){rdocs.entries[d.id]=d.data()});
      if(!snap.metadata.fromCache)defin.e=true;
      if(ready)onRemote();else chk();
    },errh));
  }catch(e){clearTimeout(tmo);fallback()}
}

function balanceOf(pid){
  var p=S.people.filter(function(x){return x.id===pid})[0];var b=p.start;
  S.entries.forEach(function(e){if(e.pid===pid)b+=e.type==='in'?e.amt:-e.amt});
  return b;
}
function sorted(pid){
  return S.entries.filter(function(e){return e.pid===pid}).sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:a.ts-b.ts});
}
function clearSample(){
  if(!S.sample)return false;
  S.entries=S.entries.filter(function(e){return !e.s});
  S.people.forEach(function(p){if(p.goal&&p.goal.s)p.goal=null});

function arm(btn,armedLabel,action){

function monthSums(pid,m){
  var i=0,o=0;
  S.entries.forEach(function(e){if(e.pid===pid&&e.date.indexOf(m)===0){if(e.type==='in')i+=e.amt;else o+=e.amt}});
  return {i:i,o:o};
}
function daysUntil(ds){
  var a=ds.split('-').map(Number),t=today().split('-').map(Number);
  return Math.round((new Date(a[0],a[1]-1,a[2])-new Date(t[0],t[1]-1,t[2]))/86400000);
}
function paceHint(p,rem){
  var es=S.entries.filter(function(e){return e.pid===p.id});
  if(!es.length)return '';
  var first=es.reduce(function(m,e){return e.date<m?e.date:m},es[0].date).slice(0,7);
  var m=today().slice(0,7),months=0,net=0;
  while(months<3){
    var ms=monthSums(p.id,m);net+=ms.i-ms.o;months++;
    if(m<=first)break;
    m=shiftMonth(m,-1);
  }
  var per=net/months;
  if(per<=0)return '使うお金を少し減らすと、欲しいものに近づくよ';
  var need=Math.ceil(rem/per);
  return need<=1?'今のペースなら、もうすぐ手に⟦入|はい⟧るよ':'今のペースなら、あと約'+need+'か⟦月|げつ⟧で手に⟦入|はい⟧るよ';
}
function goalHints(p,g,bal){
  var rem=g.target-bal,out=[];
  if(rem<=0)return out;
  if(g.by){
    var d=daysUntil(g.by);
    if(d<0)out.push('期限を過ぎているよ。日付を変えてみよう');
    else{
      var head=d===0?'今日が期限だよ。':'あと'+daysR(d)+'。';
      if(d>=60){var mo=Math.max(1,Math.round(d/30.4));out.push(head+'毎月 '+yen(Math.ceil(rem/mo))+' 貯めると、間に合うよ')}
      else{var wk=Math.max(1,Math.ceil(d/7));out.push(head+'1週間に '+yen(Math.ceil(rem/wk))+' 貯めると、間に合うよ')}
    }
  }
  var ph=paceHint(p,rem);if(ph)out.push(ph);
  return out;
}

function renderNote(){
  $('#note').textContent=(shared&&ready)?'記録は家族ノートに保存されます。ときどき「設定」からバックアップも保存してね。':storageOK
    ?'記録は、この端末のブラウザに保存されます。ときどき「設定」からバックアップを保存してね。'
    :'今の画面では記録を保存できません。「設定」からバックアップを保存してください。';
}

/* ---------- フォーム ---------- */
function setType(t){
  fType=t;fCat=null;
  $('#form').dataset.type=t;
  $('#tIn').setAttribute('aria-pressed',String(t==='in'));
  $('#tOut').setAttribute('aria-pressed',String(t==='out'));
  $('#catLab').textContent=t==='in'?'⟦何|なん⟧のお金？':'何に使った？';
  renderCats();
}
function renderCats(){
  var box=$('#cats');box.replaceChildren();
  CATS[fType].forEach(function(c){
    box.append(el('button',{class:'chip',type:'button','aria-pressed':String(fCat===c),
      onclick:function(){fCat=fCat===c?null:c;renderCats()}},c));
  });
}
function updatePreview(){
  var a=parseAmt($('#amt').value);
  $('#preview').textContent=a?yen(a)+(a>MAXAMT?'（大きすぎるよ）':''):'';
}
function resetForm(){
  editId=null;
  $('#amt').value='';$('#memo').value='';
  defaultDate=today();$('#date').value=defaultDate;$('#date').max=defaultDate;
  $('#err').textContent='';
  $('#fh').textContent='記録する';$('#submit').textContent='記録する';
  $('#cancelEdit').hidden=true;$('#delEntry').hidden=true;
  setType(fType);updatePreview();
}
function startEdit(id){
  var e=S.entries.filter(function(x){return x.id===id})[0];if(!e||readOnly)return;
  if(e.s){toast('例のデータは直せないよ');return}
  editId=id;
  setType(e.type);fCat=e.cat;renderCats();
  $('#amt').value=String(e.amt);$('#memo').value=e.memo;$('#date').value=e.date;
  $('#err').textContent='';
  $('#fh').textContent='直す';$('#submit').textContent='直す';
  $('#cancelEdit').hidden=false;$('#delEntry').hidden=false;
  updatePreview();
  var rm=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  $('#form').scrollIntoView({behavior:rm?'auto':'smooth',block:'center'});
  $('#amt').focus({preventScroll:true});
}
function submitEntry(){
  var amt=parseAmt($('#amt').value),date=$('#date').value||today();
  if(!amt){$('#err').textContent='金額を入れてね';$('#amt').focus();return}
  if(amt>MAXAMT){$('#err').textContent='9,999,999円までにしてね';return}
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){$('#err').textContent='日付を入れてね';return}
  var p=cur();
  var e={id:editId||uid(),pid:p.id,date:date,type:fType,amt:amt,cat:fCat||'その他',memo:$('#memo').value.trim().slice(0,40),ts:Date.now()};
  var msg='記録したよ';
  if(editId){
    var i=S.entries.findIndex(function(x){return x.id===editId});
    if(i>-1){e.ts=S.entries[i].ts;S.entries[i]=e}
    msg='直したよ';
  }else{
    clearSample();
    S.entries.push(e);
  }
  viewMonth=date.slice(0,7);
  if(selDay&&selDay.slice(0,7)!==viewMonth)selDay=null;
  resetForm();
  save();render();
  toast(msg);
}

/* ---------- 設定 ---------- */
function renderSettings(){
  var box=$('#settings');
  box.hidden=!settingsOpen;
  $('#gear').setAttribute('aria-expanded',String(settingsOpen));
  box.replaceChildren();
  if(!settingsOpen)return;
  var p=cur();

  var nameIn=el('input',{id:'sName',type:'text',maxlength:'20',value:p.name,onchange:function(ev){
    var v=ev.target.value.trim().slice(0,20);if(!v){ev.target.value=p.name;return}
    p.name=v;commit('名前を変えたよ');
  }});
  var startIn=el('input',{id:'sStart',type:'text',inputmode:'numeric',value:String(p.start),onchange:function(ev){
    var raw=String(ev.target.value).trim(),neg=/^[-−ー]/.test(raw),n=parseAmt(raw);
    if(n>MAXAMT)n=MAXAMT;
    p.start=neg?-n:n;commit('最初のお金を変えたよ');
  }});

  var cs=el('div',{class:'swatches',role:'group','aria-label':'ページの色'});
  var isPal=false;
  PALETTE.forEach(function(c){
    var on=!!p.color&&p.color.toLowerCase()===c[1];
    if(on||(!p.color&&c[1]===DEFAULT_COLOR))isPal=true;
    var pressed=on||(!p.color&&c[1]===DEFAULT_COLOR);
    cs.append(el('button',{class:'sw',type:'button','aria-label':c[0],'aria-pressed':String(pressed),style:'background:'+fitHero(c[1]),
      onclick:function(){p.color=c[1]===DEFAULT_COLOR?null:c[1];save();render()}},pressed?'✓':''));
  });
  var picker=el('input',{type:'color','aria-label':'好きな色を選ぶ',value:p.color||DEFAULT_COLOR,
    oninput:function(ev){applyColor(ev.target.value)},
    onchange:function(ev){p.color=ev.target.value;save();render()}});
  cs.append(el('label',{class:'sw custom'+(isPal?'':' on'),title:'好きな色を選ぶ'},picker));

  var newName=el('input',{id:'newName',type:'text',maxlength:'20',placeholder:'名前'});
  var addBtn=el('button',{class:'btn',type:'button',onclick:function(){
    var v=newName.value.trim().slice(0,20);if(!v){newName.focus();return}
    var np={id:uid(),name:v,start:0,color:null,goal:null,ts:Date.now()};
    S.people.push(np);S.cur=np.id;selDay=null;resetForm();goalEdit=false;commit('ノートを作ったよ');
  }},'追加');

  var canSave=!!dl;
  var bBackup=el('button',{class:'btn',type:'button',disabled:!canSave,onclick:function(){exportJson()}},'バックアップを保存');
  var bCsv=el('button',{class:'btn',type:'button',disabled:!canSave,onclick:function(){exportCsv()}},'表（CSV）で保存');
  var fileIn=el('input',{class:'file',id:'restoreFile',type:'file',accept:'.json,application/json',onchange:function(ev){
    var f=ev.target.files&&ev.target.files[0];ev.target.value='';if(!f)return;
    var rd=new FileReader();
    rd.onload=function(){
      var s=null;try{s=cleanState(JSON.parse(String(rd.result)))}catch(e){}
      if(!s){toast('このファイルは読みこめませんでした');return}
      pendingRestore=s;renderSettings();
    };
    rd.onerror=function(){toast('読みこめませんでした')};
    rd.readAsText(f);
  }});
  var bRestore=el('label',{class:'btn',for:'restoreFile',tabindex:'0',role:'button',style:'display:inline-flex;align-items:center',
    onkeydown:function(ev){if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();fileIn.click()}}},'バックアップから戻す');

  var delLabel=S.people.length>1?'この人のノートを消す':'記録を全部消す';
  var delBtn=el('button',{class:'dbtn',type:'button'},delLabel);
  arm(delBtn,'ほんとうに消す？',function(){
    if(S.people.length>1){
      S.entries=S.entries.filter(function(e){return e.pid!==p.id});
      S.people=S.people.filter(function(x){return x.id!==p.id});
      S.cur=S.people[0].id;
    }else{S.entries=[];p.goal=null;p.start=0}
    selDay=null;resetForm();goalEdit=false;commit('消したよ');
  });

  var furiOn=S.furi!==false;
  var furiBlock=el('div',{class:'field'},el('span',{class:'lab'},'ふりがな'),
      el('div',{class:'vtog',role:'group','aria-label':'ふりがな'},
        el('button',{type:'button','aria-pressed':String(furiOn),onclick:function(){if(!furiOn){S.furi=true;save();render()}}},'あり'),
        el('button',{type:'button','aria-pressed':String(!furiOn),onclick:function(){if(furiOn){S.furi=false;save();render()}}},'なし')));
  var famBlock;
  if(!cloudOn()){
    famBlock=el('div',{class:'field'},el('span',{class:'lab'},'家族でつなぐ'),
      el('p',{},'今は、この端末だけに保存しています。家族でつなぐには、README の手順で Firebase の設定をしてください。'));
  }else if(fam.code){
    var forget=el('button',{class:'dbtn',type:'button'},'この端末を家族ノートからはずす');
    arm(forget,'ほんとうにはずす？',function(){fam={};saveFam();location.reload()});
    famBlock=el('div',{class:'field'},el('span',{class:'lab'},'家族ノート'),
      el('p',{},'この端末の使い方：'+(role==='child'?'こども':'保護者')),
      role==='guardian'?el('div',{class:'field'},
        el('span',{class:'lab'},'家族コード（人には見せないでね）'),
        el('p',{class:'code',text:showCode(fam.code)}),
        el('div',{class:'inline'},el('button',{class:'chip',type:'button',onclick:function(){copyText(fam.code)}},'コピー'))):null,
      el('div',{class:'inline'},forget));
  }else{
    famBlock=el('div',{class:'field'},el('span',{class:'lab'},'家族でつなぐ'),
      el('p',{},'今は、この端末だけに保存しています。'),
      el('div',{class:'inline'},el('button',{class:'chip',type:'button',onclick:function(){fam={};saveFam();render()}},'家族ノートにつなぐ')));
  }
  if(role==='child'){
    box.append(
      el('h2',{},'設定'),
      el('div',{class:'field'},el('label',{for:'sName'},'名前'),nameIn),
      el('hr'),
      el('div',{class:'field'},el('span',{class:'lab'},'ページの色'),cs,
        p.color?el('div',{class:'inline'},el('button',{class:'chip',type:'button',onclick:function(){p.color=null;save();render()}},'元に戻す')):null),
      furiBlock,
      el('hr'),
      famBlock,
      el('hr'),
      el('p',{},'大きくなって表計算で見たいときは、CSVが使えます。'),
      el('div',{class:'inline'},bBackup,bCsv));
    return;
  }
  box.append(
    el('h2',{},'設定'),
    el('div',{class:'field'},el('label',{for:'sName'},'名前'),nameIn),
    el('div',{class:'field'},el('label',{for:'sStart'},'最初にあったお金（円）'),startIn),
    el('hr'),
    el('div',{class:'field'},el('span',{class:'lab'},'ページの色（ノートごとに選べます）'),cs,
      p.color?el('div',{class:'inline'},el('button',{class:'chip',type:'button',onclick:function(){p.color=null;save();render()}},'元に戻す')):null),
    furiBlock,
    el('hr'),
    famBlock,
    el('hr'),
    el('div',{class:'field'},el('label',{for:'newName'},'ノートを増やす（きょうだいなど）'),el('div',{class:'inline'},newName,addBtn)),
    el('hr'),
    el('p',{},'記録はこの端末のブラウザにあります。機種変更やブラウザのお掃除の前に、バックアップを保存しておくと安心です。大きくなって表計算で見たいときは、CSVが使えます。'),
    el('div',{class:'inline'},bBackup,bCsv,bRestore,fileIn)
  );
  if(pendingRestore){
    var n=pendingRestore.entries.length,m=pendingRestore.people.length;
    box.append(el('div',{class:'banner'},
      el('p',{},'ファイルには '+peopleR(m)+'・'+n+'件の記録が⟦入|はい⟧っています。今の記録は、これに入れかわります。'+(shared?'家族ノートの記録も、全部入れかわります。':'')),
      el('div',{class:'inline'},
        el('button',{class:'chip',type:'button',onclick:function(){S=pendingRestore;pendingRestore=null;viewMonth=today().slice(0,7);selDay=null;resetForm();goalEdit=false;save();render();toast('戻したよ')}},'入れかえる'),
        el('button',{class:'chip',type:'button',onclick:function(){pendingRestore=null;renderSettings()}},'やめる'))));
  }
  box.append(el('hr'),delBtn);
}

async function saveFile(name,data){
  if(!dl){toast('この画面では保存できません');return}
  try{await dl.save({filename:name,data:data});toast('保存したよ')}
  catch(e){if(!e||e.code!=='declined')toast('保存できませんでした')}
}
function exportJson(){saveFile('okozukai-backup-'+today()+'.json',JSON.stringify(S,null,1))}
function exportCsv(){
  function q(v){return '"'+String(v).replace(/"/g,'""')+'"'}
  var rows=[['日付','名前','もらった/使った','カテゴリ','金額','メモ','残り'].map(q).join(',')];
  S.people.forEach(function(p){
    var run=p.start;
    sorted(p.id).forEach(function(e){
      run+=e.type==='in'?e.amt:-e.amt;
      rows.push([e.date,p.name,e.type==='in'?'もらった':'使った',e.cat,e.amt,e.memo,run].map(q).join(','));
    });
  });
  saveFile('okozukai-'+today()+'.csv','﻿'+rows.join('\r\n'));
}

/* ---------- まとめ ---------- */
function render(live){
  document.body.classList.toggle('nofuri',S.furi===false);
  var fb=$('#furiBtn');fb.textContent='ふりがな '+(S.furi===false?'なし':'あり');fb.setAttribute('aria-pressed',String(S.furi!==false));
  if(role==='child'&&fam.pid&&S.people.some(function(p){return p.id===fam.pid}))S.cur=fam.pid;
  var needSetup=cloudOn()&&!fam.code&&!fam.local;
  var emptyStore=shared&&ready&&!storeHasPeople();
  if(role==='child'&&fam.code&&shared&&ready&&!fam.pid&&emptyStore){fam.pid=S.cur;saveFam()}
  var needPick=role==='child'&&!!fam.code&&shared&&ready&&!fam.pid&&!emptyStore;
  var cover=needSetup||needPick;
  $('#setup').hidden=!needSetup;$('#pick').hidden=!needPick;$('#main').hidden=cover;
  if(needSetup)renderSetup();
  if(needPick)renderPick();
  var ov=!cover&&role==='guardian'&&overview&&S.people.length>1;
  applyColor(ov?null:cur().color);
  if(!cover){
    $('#overview').hidden=!ov;
    ['#hero','#formCard','#ledger'].forEach(function(q){$(q).hidden=ov});
    $('#banner').hidden=!S.sample||ov;
    renderCodeBanner();
    renderPeople();
    if(ov){renderOverview();$('#breakdown').hidden=true}
    else{
      if(!(live&&goalEdit))renderHero();
      renderLedger();renderBreakdown();
    }
    var ae=document.activeElement;
    if(!(live&&ae&&$('#settings').contains(ae)))renderSettings();
  }
  renderNote();renderMode();
}

$('#tIn').addEventListener('click',function(){setType('in')});
$('#tOut').addEventListener('click',function(){setType('out')});
$('#amt').addEventListener('input',function(ev){
  var d=normNum(ev.target.value);
  ev.target.value=d?String(parseInt(d,10)):'';
  $('#err').textContent='';updatePreview();
});
[100,500,1000].forEach(function(n){
  $('#quick').append(el('button',{class:'chip num',type:'button',onclick:function(){
    var a=parseAmt($('#amt').value)+n;$('#amt').value=String(Math.min(a,MAXAMT));$('#err').textContent='';updatePreview();
  }},'+'+n.toLocaleString('ja-JP')));
});
$('#quick').append(el('button',{class:'chip',type:'button',onclick:function(){$('#amt').value='';updatePreview()}},'クリア'));
$('#form').addEventListener('submit',function(ev){ev.preventDefault();submitEntry()});
$('#cancelEdit').addEventListener('click',function(){resetForm()});
arm($('#delEntry'),'ほんとうに消す？',function(){
  S.entries=S.entries.filter(function(e){return e.id!==editId});
  resetForm();save();render();toast('消したよ');
});
$('#furiBtn').addEventListener('click',function(){S.furi=S.furi===false;save();render()});
$('#gear').addEventListener('click',function(){
  settingsOpen=!settingsOpen;pendingRestore=null;renderSettings();
  if(settingsOpen)$('#settings').scrollIntoView({block:'start'});
});
$('#clearSample').addEventListener('click',function(){clearSample();save();render();toast('例を消したよ')});
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState!=='visible')return;
  var t=today();
  if(!editId&&$('#date').value===defaultDate&&t!==defaultDate){defaultDate=t;$('#date').value=t;$('#date').max=t}
});

resetForm();
render();
obs=new MutationObserver(scheduleFuri);
runFuri();
initShared();

if('serviceWorker' in navigator){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
}
})();
</script>
